name: Numerical and teaching checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-discovery-numeric-lock.txt
      - run: python public_checks.py
      - run: python demo_teaching.py --output output/teaching_demo
